<div class="profile-container">
  <div *ngIf="loading()" class="status-overlay">
    <div class="spinner"></div>
    <p>Loading your profile...</p>
  </div>

  <div *ngIf="errorMessage" class="error-banner">
    <span class="error-icon">⚠️</span> {{ errorMessage }}
  </div>

  <ng-container *ngIf="user()">
    <header class="profile-header">
      <div class="header-content">
        <div class="avatar-box">
          {{ user().studentName.charAt(0) }}
        </div>
        <div class="user-meta">
          <h1 class="user-name">{{ user().studentName }}</h1>
          <div class="badge-row">
            <span class="role-tag">Student</span>
            <span class="status-pill active">
              <span class="dot"></span> Online
            </span>
          </div>
        </div>
      </div>
      <div class="header-id-watermark">
        #{{ user().studentId }}
      </div>
    </header>

    <div class="details-grid">
      <section class="info-card">
        <div class="card-title">
          <span class="title-icon">🆔</span> Account Details
        </div>
        <div class="card-body">
          <div class="data-row">
            <label>Registration Number</label>
            <p class="data-text">STU-{{ user().studentId }}</p>
          </div>
          <div class="data-row">
            <label>Full Legal Name</label>
            <p class="data-text">{{ user().studentName }}</p>
          </div>
        </div>
      </section>

      <section class="info-card">
        <div class="card-title">
          <span class="title-icon">📧</span> Contact Information
        </div>
        <div class="card-body">
          <div class="data-row">
            <label>Email Address</label>
            <p class="data-text highlight">{{ user().studentEmail }}</p>
          </div>
        </div>
      </section>
    </div>
  </ng-container>
</div>
