<div class="quiz-container" *ngIf="quiz && score === null">
  <header class="quiz-header">
    <div class="header-info">
      <span class="category-tag">Assessment</span>
      <h1>{{ quiz.questionTitle }}</h1>
      <p>{{ quiz.description }}</p>
    </div>
    <div class="quiz-meta">
      <div class="meta-item">
        <span class="label">Questions</span>
        <span class="value">{{ quiz.questions.length }}</span>
      </div>
    </div>
  </header>

  <div class="questions-stack">
    <div class="question-card" *ngFor="let q of quiz.questions; let i = index">
      <div class="q-number">Question {{ i + 1 }}</div>
      <h3>{{ q.title }}</h3>

      <div class="options-grid">
        <label class="option-item" *ngFor="let opt of q.options" [class.selected]="userAnswers[q.id] === opt">
          <input
            type="radio"
            [name]="'q' + q.id"
            [value]="opt"
            [(ngModel)]="userAnswers[q.id]"
            class="hidden-radio"
          />
          <span class="radio-custom"></span>
          <span class="option-text">{{ opt }}</span>
        </label>
      </div>
    </div>
  </div>

  <footer class="quiz-footer">
    <button class="submit-btn" (click)="submitQuiz()" [disabled]="!quiz">
      Submit Assessment
    </button>
  </footer>
</div>

<div class="result-container fade-in" *ngIf="score !== null">
  <div class="result-card">
    <div class="result-icon">🎉</div>
    <h2>Assessment Complete!</h2>
    <div class="score-display">
      <span class="current-score">{{ score }}</span>
      <span class="total-score">/ {{ quiz.questions.length }}</span>
    </div>
    <p>Your results have been recorded in your course progress.</p>

    <div class="result-actions">
      <button class="btn-secondary" (click)="score = null">Review Answers</button>
      <button class="btn-primary" (click)="score = null">Back to Course</button>
    </div>
  </div>
</div>
